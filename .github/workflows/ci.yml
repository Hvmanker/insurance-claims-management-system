name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify

  containers:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example build
      - name: Verify persona fixtures packaged in claim-service image
        run: |
          set -euo pipefail
          image_id="$(docker compose --env-file .env.example images -q claim-service)"
          if [ -z "$image_id" ]; then
            echo "claim-service image not found after compose build"
            exit 1
          fi
          cid="$(docker create "$image_id")"
          docker cp "$cid:/app/app.jar" /tmp/cs.jar
          docker rm "$cid"
          mapfile -t persona_json < <(unzip -Z1 /tmp/cs.jar | grep -E '^BOOT-INF/classes/fixtures/personas/.*\.json$')
          count="${#persona_json[@]}"
          echo "Persona fixture JSON entries (${count}):"
          printf '%s\n' "${persona_json[@]}"
          if [ "$count" -ne 10 ]; then
            echo "Expected 10 persona fixture JSON files under BOOT-INF/classes/fixtures/personas/, found ${count}"
            exit 1
          fi
