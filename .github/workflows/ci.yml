name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify

  containers:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example build
      - name: Verify persona fixtures packaged in claim-service image
        run: |
          set -euo pipefail
          img="$(docker compose --env-file .env.example config --format json | jq -r '.services["claim-service"].image // (.name + "-claim-service")')"
          if [ -z "$img" ] || [ "$img" = "null" ]; then
            img="$(docker compose --env-file .env.example config --images claim-service | head -n1)"
          fi
          if [ -z "$img" ] || [ "$img" = "null" ]; then
            echo "Could not resolve claim-service image name from compose config"
            exit 1
          fi
          if ! docker image inspect "$img" >/dev/null 2>&1; then
            echo "claim-service image not found after compose build: ${img}"
            exit 1
          fi
          cid=""
          cleanup() {
            if [ -n "${cid}" ]; then
              docker rm -f "${cid}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          cid="$(docker create "$img")"
          docker cp "${cid}:/app/app.jar" /tmp/cs.jar
          mapfile -t persona_json < <(unzip -Z1 /tmp/cs.jar | grep -E '^BOOT-INF/classes/fixtures/personas/.*\.json$')
          count="${#persona_json[@]}"
          echo "Persona fixture JSON entries (${count}):"
          printf '%s\n' "${persona_json[@]}"
          if [ "$count" -ne 10 ]; then
            echo "Expected 10 persona fixture JSON files under BOOT-INF/classes/fixtures/personas/, found ${count}"
            exit 1
          fi
