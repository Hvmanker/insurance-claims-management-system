services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka/topics.txt:/kafka/topics.txt:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        topics_file=/kafka/topics.txt
        bootstrap=kafka:9092
        kafka_topics=/opt/kafka/bin/kafka-topics.sh
        while IFS= read -r topic || [[ -n "$$topic" ]]; do
          [[ -z "$$topic" ]] && continue
          "$$kafka_topics" --bootstrap-server "$$bootstrap" --create --if-not-exists \
            --topic "$$topic" --partitions 3 --replication-factor 1
          desc="$$("$$kafka_topics" --bootstrap-server "$$bootstrap" --describe --topic "$$topic")"
          if ! grep -q 'PartitionCount: 3' <<< "$$desc"; then
            echo "kafka-init: topic $$topic missing PartitionCount: 3 (no in-place raise; down -v and fresh start)" >&2
            printf '%s\n' "$$desc" >&2
            exit 1
          fi
          printf '%s\n' "$$desc"
        done < "$$topics_file"

  claim-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: claim-service/target/claim-service-0.1.0-SNAPSHOT.jar
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx192m
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      REDIS_HOST: ${REDIS_HOST:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      DEMO_ADJUSTER_PASSWORD: ${DEMO_ADJUSTER_PASSWORD:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_AGENT_PASSWORD: ${DEMO_AGENT_PASSWORD:-}
      DEMO_AUDITOR_PASSWORD: ${DEMO_AUDITOR_PASSWORD:-}
      DEMO_BROKER_PASSWORD: ${DEMO_BROKER_PASSWORD:-}
      DEMO_FINANCE_PASSWORD: ${DEMO_FINANCE_PASSWORD:-}
      DEMO_INSURED_PASSWORD: ${DEMO_INSURED_PASSWORD:-}
      DEMO_SIU_PASSWORD: ${DEMO_SIU_PASSWORD:-}
      DEMO_SUPERVISOR_PASSWORD: ${DEMO_SUPERVISOR_PASSWORD:-}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  approval-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: approval-service/target/approval-service-0.1.0-SNAPSHOT.jar
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx160m
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  settlement-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: settlement-service/target/settlement-service-0.1.0-SNAPSHOT.jar
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx160m
      DB_URL: ${DB_URL:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?}
      SETTLEMENT_APPROVAL_SERVICE_BASE_URL: http://approval-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        JAR_FILE: notification-service/target/notification-service-0.1.0-SNAPSHOT.jar
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx128m
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?}
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  postgres-data:
